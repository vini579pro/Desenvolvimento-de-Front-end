<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 21px;
            border-radius: 10px;
        }
        #principal {
            background-color: rgb(43, 238, 228);
            border: 2px solid purple;
            color: purple;
        }
        #secundaria {
            background-color: purple;
            border: 2px solid rgb(23, 230, 212);
            color: aquamarine;
        }
        hr {
            border: none;
            border-top: 2px solid blue;
            width: 50%;
        }
    </style>
</head>
<body>
    <div id = "principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id = "secundaria">
        Esta é outra da Página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
