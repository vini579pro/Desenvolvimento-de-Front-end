<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das Tags HTML</title>
</head>
<body>
    <h1>Anatomia das Tags</h1>
    <p>
        As Tags em HTML são os elementos básicos que compõem uma página web.
        cada Tag tem uma estrutura especifica que desempenha um papel importante na organização
        de apresentação do conteúdo.
    </p>
    <p>
        este é um parágrafo que pode ter texto <strong>em negrito</strong> 
        ou texto em <em>ítalico</em>.
    </p>
</body>
</html>
