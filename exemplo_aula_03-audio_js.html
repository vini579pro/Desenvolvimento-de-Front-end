<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudio em HTML</title>
</head>
<body>
    <h1>Áudio</h1>

    <p>Clique no campo de reprodução para ouvir o áudio: </p>

    <audio id="MEUAUDIO" controls loop>
        <source
            src="audio/autotunescat.mp3"
            type="audio/mpeg"
        />
        Seu navegador não suporta a reprodução de áudio.
    </audio>

    <script>
        const audio=document.getElementById("MEUAUDIO");
        audio.volume = 0.5;
    </script>
</body>
</html>
