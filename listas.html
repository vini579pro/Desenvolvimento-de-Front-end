<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Lista</title>
</head>
<body>
    <h1>elementos da Lista</h1>
    <p>
        As listas em HTML são utilizadas para organizar informações
        em uma sequência.
    </p>
    <h2>Listas não ordenadas</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <h2>Listas ordenadas</h2>
    <ol>
        <li>primeiro item</li>
        <li>segundo item</li>
        <li>terceiro item</li>
    </ol>
</body>
</html>
